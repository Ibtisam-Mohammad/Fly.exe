name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # The data, render and web extras are installed so that contact and HTTP tests exercise
      # DuckDB instead of skipping, and so that the type check sees the same imports the
      # production environment has. GeNN, FlyGym and MuJoCo stay out: they need a native
      # build and a GPU, and their modules are covered by mypy import overrides.
      - run: uv sync --frozen --extra data --extra render --extra web
      - run: uv run ruff check .
      - run: uv run mypy
      # A floor, so coverage cannot drift down unnoticed. It is set just under what CI
      # actually measures rather than at an aspirational number: a floor nobody can meet
      # gets deleted. It moved 56 -> 54 on 2026-09-14 when the embodied swarm landed.
      # Measured locally with flygym, mujoco, pygenn and brian2 blocked at the import
      # finder, which is what this job installs: 57.4 percent over the 16,667 statements
      # that predate the swarm, 54.2 percent over all 19,492. The 2,825 new statements
      # sit at 35 percent because they need a GPU and a body to execute -- swarm3d_video
      # alone is 443 statements that no machine without a renderer can reach. Raising
      # this number means writing tests that run without a GPU, not deleting modules.
      - run: uv run pytest --cov=flysim --cov-report=term-missing --cov-fail-under=54
