name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # The data and render extras are installed so that the contact-audit test exercises
      # DuckDB instead of skipping, and so that the type check sees the same imports the
      # production environment has. GeNN, FlyGym and MuJoCo stay out: they need a native
      # build and a GPU, and their modules are covered by mypy import overrides.
      - run: uv sync --frozen --extra data --extra render
      - run: uv run ruff check .
      - run: uv run mypy
      # A floor, so coverage cannot drift down unnoticed. It is set just under the
      # 56.4 percent measured on 2026-09-12 rather than at an aspirational number:
      # a floor nobody can meet gets deleted. The modules at zero are the ones that
      # need a GPU, a body or both -- cli, demo01_embodied, demo02_embodied,
      # demo02_acceptance, both probes and the renderers -- and CI has none of those,
      # so raising this number means writing tests that run without them.
      - run: uv run pytest --cov=flysim --cov-report=term-missing --cov-fail-under=56
