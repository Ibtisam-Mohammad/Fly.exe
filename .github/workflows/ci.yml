name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # The data, render and web extras are installed so that contact and HTTP tests exercise
      # DuckDB instead of skipping, and so that the type check sees the same imports the
      # production environment has. GeNN, FlyGym and MuJoCo stay out: they need a native
      # build and a GPU, and their modules are covered by mypy import overrides.
      - run: uv sync --frozen --extra data --extra render --extra web
      - run: uv run ruff check .
      - run: uv run mypy
      # A floor, so coverage cannot drift down unnoticed. It is set just under what CI
      # actually measures rather than at an aspirational number: a floor nobody can meet
      # gets deleted. It moved 56 -> 53 on 2026-09-14 when the embodied swarm landed.
      # Measured by reproducing this job locally with flygym, mujoco, pygenn and brian2
      # blocked at the import finder: 54.17 percent over 19,492 statements, against 57.4
      # percent over the 16,667 that predate the swarm. The 2,825 new statements sit at
      # 35 percent because they need a GPU and a body to execute -- swarm3d_video alone
      # is 443 statements that no machine without a renderer can reach. The floor is a
      # point below the measurement so that ordinary churn does not trip it; raising it
      # means writing tests that run without a GPU, not deleting modules.
      - run: uv run pytest --cov=flysim --cov-report=term-missing --cov-fail-under=53
