[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "malecns-flysim"
version = "0.1.0"
description = "Scientifically explicit MaleCNS-constrained virtual fly simulator"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "MaleCNS Virtual Fly contributors" }]
keywords = ["drosophila", "connectome", "simulation", "MaleCNS"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.1,<3",
  "pyarrow>=18,<22",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.4,<2",
  "neuprint-python>=0.5,<1",
  "polars>=1.33,<2",
]
body = [
  "flygym==2.1.0",
  "mujoco>=3.9,<3.10",
]
reference = ["brian2>=2.9,<3"]
render = [
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "pillow>=11,<13",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
flysim = "flysim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flysim"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flysim"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "brian2", "brian2.*", "pygenn", "pygenn.*", "pandas", "pandas.*", "flygym", "flygym.*", "flygym_demo", "flygym_demo.*", "mujoco", "mujoco.*"]
ignore_missing_imports = true

[tool.flysim.native-dependencies]
pygenn = "https://github.com/genn-team/genn/archive/refs/tags/5.4.0.zip"
pygenn_install_scope = "FlyBrain WSL only; use scripts/install_genn.sh"
